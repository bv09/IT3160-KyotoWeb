<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Tìm đường - Kyoto</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div id="map"></div>

    <!-- Controls -->
    <div class="map-controls">
        <button id="btnRoute">Tìm đường</button>
        <button id="btnClear">Clear</button>
    </div>

    <!-- Khoảng cách -->
    <div id="distance-info"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initMap } from "./js/map.js";
        import { loadStations } from "./js/stations.js";
        import { initPathfinder, addPoint, isInSelectingMode } from "./js/pathfinder.js";

        // 1. Khởi tạo bản đồ
        const map = initMap("map");

        // 2. Khởi tạo pathfinder (nút bấm, click events)
        initPathfinder(map);

        // 3. Tải và hiển thị trạm/điểm dừng
        //    Khi click vào marker trạm → thêm vào danh sách điểm chọn
        loadStations(map, ({ lat, lon }) => {
            if (isInSelectingMode()) {
                addPoint(map, lat, lon);
            }
        });
    </script>
</body>
</html>
