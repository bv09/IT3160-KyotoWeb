<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Tìm đường - Kyoto</title>
    <meta name="description" content="Ứng dụng tìm đường tàu điện ngầm Kyoto — hỗ trợ cả người dùng lẫn quản trị viên.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div id="map"></div>

    <button id="btnOpenSidebar" class="sidebar-open-btn" title="Mở bảng điều khiển">&#9776;</button>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <span class="sidebar-icon">🚇</span>
                <span>Kyoto Metro</span>
            </div>
            <button id="btnCloseSidebar" class="sidebar-close-btn" title="Đóng">✕</button>
        </div>

        <div class="sidebar-content">

            <!-- Role Selector -->
            <div class="role-switcher">
                <button id="btnRoleUser" class="role-btn active" data-role="user">
                    <span class="role-icon">👤</span> Người dùng
                </button>
                <button id="btnRoleAdmin" class="role-btn" data-role="admin">
                    <span class="role-icon">🔧</span> Quản trị
                </button>
            </div>

            <div class="divider"></div>

            <!-- ── User Section ── -->
            <div id="userSection" class="role-section active">
                <p class="section-label">TÌM ĐƯỜNG</p>
                <div class="btn-row">
                    <button id="btnRoute" class="btn btn-primary">
                        <span>📍</span> Chọn vị trí
                    </button>
                    <button id="btnClear" class="btn btn-ghost">
                        <span>🗑</span> Xóa
                    </button>
                </div>
                <p class="hint-text">Bấm "Chọn ví trí" rồi click 2 vị trí trên bản đồ để tìm đường đi nhanh nhất.</p>

                <div id="result-box" class="result-box hidden">
                    <div class="result-title">📊 Kết quả</div>
                    <div class="result-row">
                        <span class="result-label">🗺 Khoảng cách</span>
                        <span id="distance-info" class="result-value">—</span>
                    </div>
                    <div class="result-row">
                        <span class="result-label">⏱ Thời gian</span>
                        <span id="time-info" class="result-value">—</span>
                    </div>
                </div>
            </div>

            <!-- ── Admin Section ── -->
            <div id="adminSection" class="role-section">
                <p class="section-label">QUẢN TRỊ GRAPH</p>
                <div class="btn-row">
                    <button id="btnToggleGraph" class="btn btn-primary">
                        <span>🔗</span> Hiện Graph
                    </button>
                </div>

                <div class="divider"></div>

                <p class="section-label">DỪNG TRẠM</p>
                <div class="btn-row">
                    <button id="btnStopMode" class="btn btn-warning">
                        🚫 Bật chế độ dừng
                    </button>
                </div>
                <div id="stop-mode-hint" class="hint-box hidden">
                    ⚡ Đang ở chế độ dừng trạm. Click vào một trạm trên bản đồ để bật/tắt.
                </div>
                <div id="blocked-list-box" class="blocked-list-box hidden">
                    <div class="result-title">🚫 Trạm đang dừng</div>
                    <ul id="blocked-list" class="blocked-list"></ul>
                    <button id="btnClearBlocked" class="btn btn-ghost btn-full">Khôi phục tất cả</button>
                </div>
            </div>

        </div>

        <div class="sidebar-footer">
            IT3160 — Kyoto Subway Pathfinder
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initMap }      from "./js/map.js";
        import { loadStations } from "./js/stations.js";
        import { initPathfinder, addPoint, isInSelectingMode, clearPath } from "./js/pathfinder.js";
        import { initGraphDisplay, showGraphFromData, hideGraph, isGraphVisible } from "./js/graph-display.js";

        // ── Global State ──
        window.APP_ROLE  = "user";
        window.STOP_MODE = false;

        // ── 1. Init Map ──
        const map = initMap("map");

        // ── 2. Sidebar Toggle ──
        const sidebar  = document.getElementById("sidebar");
        const btnOpen  = document.getElementById("btnOpenSidebar");
        const btnClose = document.getElementById("btnCloseSidebar");

        const openSidebar  = () => { sidebar.classList.remove("collapsed"); btnOpen.classList.add("hidden"); };
        const closeSidebar = () => { sidebar.classList.add("collapsed");    btnOpen.classList.remove("hidden"); };

        btnClose.addEventListener("click", closeSidebar);
        btnOpen.addEventListener("click",  openSidebar);

        // ── 3. Role Switch ──
        const userSection  = document.getElementById("userSection");
        const adminSection = document.getElementById("adminSection");
        const btnTG = document.getElementById("btnToggleGraph");

        document.querySelectorAll(".role-btn").forEach(btn => {
            btn.addEventListener("click", async () => {
                document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                window.APP_ROLE = btn.dataset.role;

                if (window.APP_ROLE === "user") {
                    userSection.classList.add("active");
                    adminSection.classList.remove("active");
                    window.STOP_MODE = false;
                    updateStopModeUI();
                    hideGraph(map);
                    btnTG.innerHTML = "<span>🔗</span> Hiện Graph";
                    btnTG.classList.remove("active");
                } else {
                    clearPath(map);
                    userSection.classList.remove("active");
                    adminSection.classList.add("active");
                    // Graph mặc định ẨN khi vào Admin — admin tự bật nếu muốn
                    btnTG.innerHTML = "<span>🔗</span> Hiện Graph";
                    btnTG.classList.remove("active");
                    await refreshAdminView();
                }
            });
        });

        // ── 4. Stop Mode ──
        const btnStopMode    = document.getElementById("btnStopMode");
        const stopModeHint   = document.getElementById("stop-mode-hint");
        const blockedListBox = document.getElementById("blocked-list-box");
        const blockedList    = document.getElementById("blocked-list");

        function updateStopModeUI() {
            if (window.STOP_MODE) {
                btnStopMode.textContent = "✅ Tắt chế độ dừng";
                btnStopMode.classList.add("active");
                stopModeHint.classList.remove("hidden");
                map.getContainer().style.cursor = "crosshair";
            } else {
                btnStopMode.textContent = "🚫 Bật chế độ dừng";
                btnStopMode.classList.remove("active");
                stopModeHint.classList.add("hidden");
                map.getContainer().style.cursor = "";
            }
        }

        btnStopMode.addEventListener("click", () => {
            window.STOP_MODE = !window.STOP_MODE;
            updateStopModeUI();
        });

        // TỐI ƯU: 1 request duy nhất thay vì N request tuần tự
        document.getElementById("btnClearBlocked").addEventListener("click", async () => {
            try {
                await fetch("/api/v1/unblock-all", { method: "POST" });
                await refreshAdminView();
            } catch (e) { console.error(e); }
        });

        // ── 5. Core Helpers ──

        /**
         * TỐI ƯU: Fetch graph-edges 1 lần duy nhất,
         * dùng chung cho cả loadStations() lẫn showGraph().
         *
         * Nếu graph đang ẨN: chỉ cần blocked_nodes → dùng graph-edges (backend trả nhanh vì edges/nodes đã cache).
         * Nếu graph đang HIỆN: cùng 1 response đó vẽ lại graph luôn, không fetch thêm.
         */
        async function refreshAdminView() {
            const res  = await fetch("/api/v1/graph-edges");
            const data = await res.json();

            const blockedNodes = new Set((data.blocked_nodes || []).map(String));
            const nodeNameMap  = buildNodeNameMap(data.edges || []);

            await loadStations(map, onStationClick, blockedNodes);
            if (isGraphVisible()) {
                showGraphFromData(map, data);  // tái dùng data đã fetch, không gọi thêm
            }
            refreshBlockedList(blockedNodes, nodeNameMap);
        }

        function buildNodeNameMap(edges) {
            const map = {};
            for (const edge of edges) {
                if (edge.from_name) map[String(edge.from)] = edge.from_name;
                if (edge.to_name)   map[String(edge.to)]   = edge.to_name;
            }
            return map;
        }

        function refreshBlockedList(blockedNodes, nodeNameMap) {
            const blocked = [...blockedNodes];
            if (blocked.length > 0) {
                blockedListBox.classList.remove("hidden");
                blockedList.innerHTML = blocked.map(id => {
                    const name = nodeNameMap[id] || "Node #" + id;
                    return `<li class="blocked-item">
                        <span class="blocked-name">${name}</span>
                        <button class="btn-restore" data-node-id="${id}" title="Khôi phục trạm này">&#x2715;</button>
                    </li>`;
                }).join("");

                blockedList.querySelectorAll(".btn-restore").forEach(restoreBtn => {
                    restoreBtn.addEventListener("click", async () => {
                        try {
                            await fetch("/api/v1/toggle-node", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ node_id: parseInt(restoreBtn.dataset.nodeId) })
                            });
                            await refreshAdminView();
                        } catch (e) { console.error(e); }
                    });
                });
            } else {
                blockedListBox.classList.add("hidden");
                blockedList.innerHTML = "";
            }
        }

        async function onStationClick({ lat, lon, node_id }) {
            if (window.APP_ROLE === "user") {
                if (isInSelectingMode()) addPoint(map, lat, lon);
            } else if (window.APP_ROLE === "admin" && window.STOP_MODE) {
                try {
                    const response = await fetch("/api/v1/toggle-node", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ node_id })
                    });
                    if (response.ok) await refreshAdminView();
                } catch (err) { console.error("Toggle node error:", err); }
            }
        }

        // ── 6. Init ──
        loadStations(map, onStationClick);
        initPathfinder(map);
        initGraphDisplay(map);

    </script>
</body>
</html>
